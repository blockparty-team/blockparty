<app-tickets>
  <ion-accordion>
    <ion-item slot="header" color="primary">
      <ion-label>
        <h2>Festival Pass</h2>
      </ion-label>
    </ion-item>
    <div
      class="ion-padding"
      slot="content"
      [style.background-color]="'var(--ion-color-light)'"
    >
      <ion-list lines="none">
        <ion-item
          (click)="
            onGoToTicket(
              'https://secure.tickster.com/en/cfe62h3pnxv5hr6/products'
            )
          "
          button="true"
          color="light"
        >
          <ion-icon name="ticket" slot="start"></ion-icon>
          Buy now on Tickster
        </ion-item>
      </ion-list>
    </div>
  </ion-accordion>
